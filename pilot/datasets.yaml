# Approved datasets of the pilot (feature 010, research R-07): generated by the incident generator
# with a seed, so every run of a dataset is the same set. The platform's harness scores the answer
# fields named in `scored_fields` against each row's `expected`, and recall per slice.
datasets:
  - id: golden
    version: "1.0.0"
    seed: 7
    size: 200
    pii_share: 0.0
    scored_fields: [team, category, priority]
    slices:
      - {name: p1, field: priority, value: P1}
      - {name: security, field: category, value: security}
  - id: regression
    version: "1.0.0"
    seed: 2026
    size: 500
    pii_share: 0.0
    scored_fields: [team, category, priority]
    slices:
      - {name: p1, field: priority, value: P1}
  - id: pii
    version: "1.0.0"
    seed: 5
    size: 100
    pii_share: 1.0
    scored_fields: [team]
    slices: []
