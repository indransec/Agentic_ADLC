[project]
name = "adlc"
version = "0.1.0"
description = "Agentic ADLC platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "cel-python>=0.5.0",
    "fastapi>=0.162.2",
    "itsdangerous>=2.2.0",
    "jsonschema>=4.26.0",
    "networkx>=3.7",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2.1.8",
    "typer>=0.28.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
adlc-api = "adlc.api.__main__:main"
adlc-account = "adlc.cli.account:app"
adlc-spec = "adlc.spec_toolkit.cli:app"
adlc-orchestrator = "adlc.orchestration.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adlc"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM"]
ignore = ["N818"]  # exception names follow the contracts (e.g. NotAuthenticated)

[tool.ruff.lint.isort]
known-first-party = ["adlc", "tests", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608"]
# SQL-heavy files: long SQL string literals read better unwrapped.
"tests/integration/**" = ["S101", "S105", "S106", "S603", "S607", "S608", "E501"]
"src/adlc/spec_toolkit/register.py" = ["E501"]
"scripts/**" = ["S603", "S607"]
"db/migrations/**" = ["S608", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts", "db/migrations"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["celpy", "celpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker (testcontainers PostgreSQL)"]
addopts = "-ra --cov=adlc --cov-report=term:skip-covered"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
    "types-jsonschema>=4.26.0.20261006",
    "types-networkx>=3.6.1.20261108",
]
