# yaml-language-server: $schema=../schema/catalogues/mcp_servers.schema.json
# MCP server registry (SA §7.3, §13). Every tool scope (mcp:<server>:<scope>) and grounding
# server in a terminal spec must exist here (rule V-06). Mocks implement the same scopes.
catalogue: mcp_servers
version: "1.0.0"
mcp_servers:
  - {id: sharepoint, owner_role: adlc_coe, scopes: [read], description: "Enterprise documents (policies, strategy)"}
  - {id: confluence, owner_role: adlc_coe, scopes: [read, write], description: "Enterprise wiki (capabilities, standards, runbooks)"}
  - {id: portfolio, owner_role: adlc_coe, scopes: [read], description: "Use-case and agent portfolio (duplicate check)"}
  - {id: jira, owner_role: product_owner, scopes: [read], description: "Epics and backlog"}
  - {id: arch_repo, owner_role: solution_architect, scopes: [read], description: "Reference architectures and ADRs"}
  - {id: mcp_registry, owner_role: adlc_coe, scopes: [read], description: "Approved MCP servers and tools"}
  - {id: git, owner_role: engineering_lead, scopes: [branch_write, read], description: "Source control for the pilot agent"}
  - {id: ci, owner_role: engineering_lead, scopes: [run], description: "CI pipeline runs and results"}
  - {id: prompt_registry, owner_role: engineering_lead, scopes: [write, read], description: "Versioned prompts and instructions"}
  - {id: artifact_store, owner_role: engineering_lead, scopes: [write, read], description: "Content-addressed build artifacts"}
  - {id: harness, owner_role: qa_eval_lead, scopes: [run], description: "Evaluation harness"}
  - {id: eval_store, owner_role: qa_eval_lead, scopes: [write, read], description: "Evaluation runs and results"}
  - {id: dataset_registry, owner_role: data_owner, scopes: [read], description: "Approved datasets"}
  - {id: redteam_harness, owner_role: security_officer, scopes: [run], description: "Red-team test harness"}
  - {id: iam, owner_role: security_officer, scopes: [read, revoke], description: "Identities and permissions"}
  - {id: dlp_scanner, owner_role: privacy_officer, scopes: [run], description: "Data loss prevention scanning"}
  - {id: control_library, owner_role: security_officer, scopes: [read], description: "Security and RAI control library"}
  - {id: grc, owner_role: compliance_officer, scopes: [write, read], description: "Governance, risk and compliance records"}
  - {id: servicenow, owner_role: release_manager, scopes: [change_create, incident_create, read], description: "ITSM change and incident records (mocked in the MVP)"}
  - {id: cmdb, owner_role: service_owner, scopes: [read, write], description: "Configuration management database (mocked in the MVP)"}
  - {id: monitoring, owner_role: sre, scopes: [configure, read], description: "Dashboards and alerts"}
  - {id: cd, owner_role: sre, scopes: [deploy], description: "Deployment pipeline (simulated in the MVP)"}
  - {id: traffic_manager, owner_role: sre, scopes: [write], description: "Traffic splitting between versions"}
  - {id: agent_registry, owner_role: adlc_coe, scopes: [write, read], description: "Enterprise agent registry"}
  - {id: observability, owner_role: sre, scopes: [read], description: "Traces, metrics and logs of the pilot agent"}
  - {id: feedback, owner_role: product_owner, scopes: [read], description: "User ratings and complaints"}
  - {id: kill_switch, owner_role: service_owner, scopes: [invoke], description: "Emergency stop for the pilot agent"}
