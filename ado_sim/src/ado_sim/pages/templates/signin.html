{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block main %}
<h1>Sign in</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/_signin" class="card-form">
  <input type="hidden" name="csrf" value="{{ presession }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="unique_name">User</label>
  <select id="unique_name" name="unique_name" required>
    {% for person in people %}
    <option value="{{ person.unique_name }}"{% if person.unique_name == chosen %} selected{% endif %}>{{ person.display_name }} ({{ person.unique_name }})</option>
    {% endfor %}
  </select>
  <label for="credential">Password or personal access token</label>
  <input id="credential" name="credential" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
