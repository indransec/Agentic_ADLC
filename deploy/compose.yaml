# One environment definition for dev and the demo host (SA §15, FR-001, FR-002).
# Values come from .env (see .env.example); no secret literal appears here.
# Inside containers, DB host/port and the account file path are overridden
# (contracts/settings.md "Host and container values").
name: adlc

x-db-settings: &db-settings
  ADLC_ENV: ${ADLC_ENV:?ADLC_ENV is required}
  ADLC_DB_HOST: postgres
  ADLC_DB_PORT: "5432"
  ADLC_DB_NAME: ${ADLC_DB_NAME:-adlc}
  ADLC_DB_APP_USER: ${ADLC_DB_APP_USER:-adlc_app}
  ADLC_DB_OWNER_USER: ${ADLC_DB_OWNER_USER:-adlc_owner}

services:
  postgres:
    networks: [platform]
    image: postgres:16.15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ADLC_DB_NAME: ${ADLC_DB_NAME:-adlc}
      ADLC_DB_APP_USER: ${ADLC_DB_APP_USER:-adlc_app}
      ADLC_DB_APP_PASSWORD: ${ADLC_DB_APP_PASSWORD:?ADLC_DB_APP_PASSWORD is required}
      ADLC_DB_OWNER_USER: ${ADLC_DB_OWNER_USER:-adlc_owner}
      ADLC_DB_OWNER_PASSWORD: ${ADLC_DB_OWNER_PASSWORD:?ADLC_DB_OWNER_PASSWORD is required}
    volumes:
      - adlc-pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${ADLC_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ${ADLC_DB_NAME:-adlc}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  jaeger:
    networks: [platform, pilot]
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "${ADLC_JAEGER_UI_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:13133/status"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    networks: [platform]
    image: adlc-api:0.1.0
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *db-settings
      ADLC_DB_OWNER_PASSWORD: ${ADLC_DB_OWNER_PASSWORD:?ADLC_DB_OWNER_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Registers adlc-specs from the image into the registry after migrating (spec 002 FR-023a).
  # Validation runs without the git baseline here; L5 against the registry still applies.
  register:
    networks: [platform]
    image: adlc-api:0.1.0
    command: ["adlc-spec", "register", "adlc-specs"]
    environment:
      <<: *db-settings
      ADLC_DB_OWNER_PASSWORD: ${ADLC_DB_OWNER_PASSWORD:?ADLC_DB_OWNER_PASSWORD is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    networks: [platform]
    image: adlc-api:0.1.0
    environment:
      ADLC_TIME_SCALE: ${ADLC_TIME_SCALE:-1.0}  # 013: shown beside dashboard durations
      <<: *db-settings
      ADLC_DB_APP_PASSWORD: ${ADLC_DB_APP_PASSWORD:?ADLC_DB_APP_PASSWORD is required}
      ADLC_DB_CONNECT_TIMEOUT: ${ADLC_DB_CONNECT_TIMEOUT:-60s}
      ADLC_SESSION_SECRET: ${ADLC_SESSION_SECRET:?ADLC_SESSION_SECRET is required}
      ADLC_SESSION_TTL: ${ADLC_SESSION_TTL:-8h}
      ADLC_ACCOUNTS_FILE: /run/adlc/accounts.yaml
      ADLC_ROLE_CATALOGUE: adlc-specs/shared/roles.yaml
      ADLC_OTLP_ENDPOINT: http://jaeger:4318
      ADLC_LOG_LEVEL: ${ADLC_LOG_LEVEL:-INFO}
      ADLC_FILE_STORE_DIR: /var/lib/adlc/files
      # Shared with the orchestrator (feature 007: the API runs the human operations).
      ADLC_DEADLETTER_ROLE: ${ADLC_DEADLETTER_ROLE:?ADLC_DEADLETTER_ROLE is required}
      ADLC_SYNTHETIC_DIR: ${ADLC_SYNTHETIC_DIR:-data/synthetic}
      ADLC_SPEC_DIR: adlc-specs
    volumes:
      - ${ADLC_ACCOUNTS_FILE:?ADLC_ACCOUNTS_FILE is required}:/run/adlc/accounts.yaml:ro
      - adlc-files:/var/lib/adlc/files
    ports:
      - "${ADLC_API_PORT:-8000}:8000"
    depends_on:
      register:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Web application (feature 007): a client of the API only; no database settings.
  ui:
    networks: [platform]
    image: adlc-api:0.1.0
    command:
      - streamlit
      - run
      - src/adlc/ui/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      ADLC_API_URL: http://api:8000
      ADLC_UI_DASHBOARD_REFRESH: ${ADLC_UI_DASHBOARD_REFRESH:-10s}
    ports:
      - "${ADLC_UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Knowledge MCP server (feature 008): the T0-T2 agents' read-only grounding over a document
  # folder (the synthetic set baked into the image). Reachable only inside the network.
  knowledge:
    networks: [platform]
    image: adlc-api:0.1.0
    command: ["adlc-knowledge"]
    environment:
      ADLC_KNOWLEDGE_DIR: data/knowledge
      ADLC_KNOWLEDGE_TOKEN: ${ADLC_KNOWLEDGE_TOKEN:?ADLC_KNOWLEDGE_TOKEN is required}
      ADLC_SPEC_DIR: adlc-specs
      ADLC_KNOWLEDGE_PORT: "8020"
      ADLC_LOG_LEVEL: ${ADLC_LOG_LEVEL:-INFO}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Lifecycle orchestrator (feature 003): delivers events, advances runs, fires timers.
  orchestrator:
    networks: [platform]
    image: adlc-api:0.1.0
    command: ["adlc-orchestrator", "run"]
    environment:
      <<: *db-settings
      ADLC_DB_APP_PASSWORD: ${ADLC_DB_APP_PASSWORD:?ADLC_DB_APP_PASSWORD is required}
      ADLC_DB_CONNECT_TIMEOUT: ${ADLC_DB_CONNECT_TIMEOUT:-60s}
      ADLC_ROLE_CATALOGUE: adlc-specs/shared/roles.yaml
      ADLC_OTLP_ENDPOINT: http://jaeger:4318
      ADLC_LOG_LEVEL: ${ADLC_LOG_LEVEL:-INFO}
      ADLC_TIME_SCALE: ${ADLC_TIME_SCALE:-1.0}
      ADLC_POLL_INTERVAL: ${ADLC_POLL_INTERVAL:-1s}
      ADLC_LEASE: ${ADLC_LEASE:-5min}
      ADLC_HEARTBEAT_MAX_AGE: ${ADLC_HEARTBEAT_MAX_AGE:-30s}
      ADLC_MONITOR_INTERVAL: ${ADLC_MONITOR_INTERVAL:-1min}
      ADLC_DEADLETTER_ROLE: ${ADLC_DEADLETTER_ROLE:?ADLC_DEADLETTER_ROLE is required}
      ADLC_SYNTHETIC_DIR: ${ADLC_SYNTHETIC_DIR:-data/synthetic}
      # The enterprise directory for in_directory checks (feature 004), read-only.
      ADLC_ACCOUNTS_FILE: /run/adlc/accounts.yaml
      # Evidence ledger file store (feature 005): back this volume up with the database.
      ADLC_FILE_STORE_DIR: /var/lib/adlc/files
      # Agent runtime (feature 006). Empty keys mean that provider is skipped.
      ADLC_MODEL_PROFILE: ${ADLC_MODEL_PROFILE:-default}
      ADLC_REVIEWER_MODE: ${ADLC_REVIEWER_MODE:-stub}
      ADLC_ANTHROPIC_API_KEY: ${ADLC_ANTHROPIC_API_KEY:-}
      ADLC_OPENAI_API_KEY: ${ADLC_OPENAI_API_KEY:-}
      ADLC_GEMINI_API_KEY: ${ADLC_GEMINI_API_KEY:-}
      ADLC_AGENT_CORRECTIONS: ${ADLC_AGENT_CORRECTIONS:-2}
      ADLC_MODEL_OUTAGE_LIMIT: ${ADLC_MODEL_OUTAGE_LIMIT:-30min}
      ADLC_COST_ALERT_LEVELS: ${ADLC_COST_ALERT_LEVELS:-5,20,50}
      ADLC_AGENT_LIMITS: ${ADLC_AGENT_LIMITS:-}
      ADLC_AGENT_LIMIT_OVERRIDES: ${ADLC_AGENT_LIMIT_OVERRIDES:-}
      # Knowledge MCP server (feature 008).
      ADLC_KNOWLEDGE_URL: http://knowledge:8020
      ADLC_KNOWLEDGE_TOKEN: ${ADLC_KNOWLEDGE_TOKEN:?ADLC_KNOWLEDGE_TOKEN is required}
      # MCP tool servers (feature 010): agents' tools and the pilot evidence. Without the key the
      # platform has no tools and reads synthetic env/template evidence (labelled).
      ADLC_TOOLS_URL: http://tools:8030
      ADLC_PILOT_BRIDGE_URL: http://pilot-bridge:8040
      ADLC_TOOLS_TOKEN_KEY: ${ADLC_TOOLS_TOKEN_KEY:-}
      ADLC_TOOLS_TIMEOUT_S: ${ADLC_TOOLS_TIMEOUT_S:-120}
    volumes:
      - ${ADLC_ACCOUNTS_FILE:?ADLC_ACCOUNTS_FILE is required}:/run/adlc/accounts.yaml:ro
      - adlc-files:/var/lib/adlc/files
    depends_on:
      register:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
      knowledge:
        condition: service_started
    healthcheck:
      test: ["CMD", "adlc-orchestrator", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # Tools MCP server (feature 010): the eval store and the enterprise mocks (ITSM, CMDB, agent
  # registry, IAM, GRC, control library). Platform network only; app database role; no ports.
  tools:
    networks: [platform]
    image: adlc-api:0.1.0
    command: ["adlc-tools"]
    environment:
      <<: *db-settings
      ADLC_DB_APP_PASSWORD: ${ADLC_DB_APP_PASSWORD:?ADLC_DB_APP_PASSWORD is required}
      ADLC_TOOLS_TOKEN_KEY: ${ADLC_TOOLS_TOKEN_KEY:?ADLC_TOOLS_TOKEN_KEY is required}
      ADLC_TOOLS_PORT: "8030"
      ADLC_SPEC_DIR: adlc-specs
      ADLC_CONTROLS_FILE: data/controls/controls.yaml
      ADLC_LOG_LEVEL: ${ADLC_LOG_LEVEL:-INFO}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8030/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Pilot bridge (feature 010): the pilot-facing MCP servers. The only service on both networks;
  # it holds no database, model, knowledge or session settings (research R-01). No ports.
  pilot-bridge:
    networks: [platform, pilot]
    image: adlc-api:0.1.0
    command: ["adlc-pilot-bridge"]
    environment:
      ADLC_TOOLS_TOKEN_KEY: ${ADLC_TOOLS_TOKEN_KEY:?ADLC_TOOLS_TOKEN_KEY is required}
      ADLC_BRIDGE_PORT: "8040"
      ADLC_BRIDGE_DATA_DIR: /var/lib/adlc/bridge
      ADLC_BRIDGE_PILOT_DEV_URL: http://pilot-dev:8100
      ADLC_BRIDGE_PILOT_TEST_URL: http://pilot-test:8100
      ADLC_BRIDGE_PILOT_PRODSIM_URL: http://pilot-prodsim:8100
      ADLC_BRIDGE_PILOT_LAB_URL: http://pilot-lab:8300
      ADLC_BRIDGE_PILOT_TRAFFIC_URL: http://pilot-traffic:8200
      ADLC_BRIDGE_JAEGER_URL: http://jaeger:16686
      ADLC_BRIDGE_PILOT_SERVICE: ${ADLC_BRIDGE_PILOT_SERVICE:-pilot-triage-prod-sim}
      ADLC_BRIDGE_MONITOR_INTERVAL_S: ${ADLC_BRIDGE_MONITOR_INTERVAL_S:-30}
      ADLC_SPEC_DIR: adlc-specs
      ADLC_REDTEAM_SUITE: data/redteam/suite.yaml
      ADLC_LOG_LEVEL: ${ADLC_LOG_LEVEL:-INFO}
    volumes:
      - bridge-data:/var/lib/adlc/bridge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8040/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Pilot environments (feature 009): the Incident Triage Assistant on its own network. The
  # platform reaches them only through feature 010's MCP servers; no ports, no Docker socket.
  pilot-dev:
    image: adlc-pilot:0.1.0
    build:
      context: ..
      dockerfile: deploy/pilot.Dockerfile
    networks: [pilot]
    command: ["pilot-host", "--env", "dev"]
    environment:
      PILOT_TEMPLATE: /pilot/template
      PILOT_REGISTRY: /packages
      PILOT_RECORDS: /records
      PILOT_WORK: /tmp/pilot-work
      PILOT_OTLP_ENDPOINT: http://jaeger:4318
      PILOT_MODEL_URL: ${PILOT_MODEL_URL:-https://api.openai.com/v1}
      PILOT_MODEL_NAME: ${PILOT_MODEL_NAME:-gpt-4o-mini}
      PILOT_MODEL_API_KEY: ${PILOT_MODEL_API_KEY:-}
      PILOT_MODEL_PRICE_PER_1K_TOKENS: ${PILOT_MODEL_PRICE_PER_1K_TOKENS:-0}
    volumes:
      - pilot-packages:/packages
      - pilot-records:/records
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  pilot-test:
    image: adlc-pilot:0.1.0
    networks: [pilot]
    command: ["pilot-host", "--env", "test"]
    environment:
      PILOT_TEMPLATE: /pilot/template
      PILOT_REGISTRY: /packages
      PILOT_RECORDS: /records
      PILOT_WORK: /tmp/pilot-work
      PILOT_OTLP_ENDPOINT: http://jaeger:4318
      PILOT_MODEL_URL: ${PILOT_MODEL_URL:-https://api.openai.com/v1}
      PILOT_MODEL_NAME: ${PILOT_MODEL_NAME:-gpt-4o-mini}
      PILOT_MODEL_API_KEY: ${PILOT_MODEL_API_KEY:-}
      PILOT_MODEL_PRICE_PER_1K_TOKENS: ${PILOT_MODEL_PRICE_PER_1K_TOKENS:-0}
    volumes:
      - pilot-packages:/packages
      - pilot-records:/records
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  pilot-prodsim:
    image: adlc-pilot:0.1.0
    networks: [pilot]
    command: ["pilot-host", "--env", "prod-sim"]
    environment:
      PILOT_TEMPLATE: /pilot/template
      PILOT_REGISTRY: /packages
      PILOT_RECORDS: /records
      PILOT_WORK: /tmp/pilot-work
      PILOT_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - pilot-packages:/packages
      - pilot-records:/records
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  pilot-traffic:
    image: adlc-pilot:0.1.0
    networks: [pilot]
    command: ["pilot-traffic"]
    environment:
      PILOT_TEMPLATE: /pilot/template
      PILOT_TRAFFIC_TARGET: http://pilot-prodsim:8100
      PILOT_TRAFFIC_RATE: ${PILOT_TRAFFIC_RATE:-1}
      PILOT_TRAFFIC_SEED: ${PILOT_TRAFFIC_SEED:-2026}
      PILOT_TRAFFIC_PII_SHARE: ${PILOT_TRAFFIC_PII_SHARE:-0.25}
    volumes:
      - pilot-data:/data
    depends_on:
      pilot-prodsim:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Builds and datasets for the platform's CI, artifact store and evaluation harness (feature 010).
  pilot-lab:
    image: adlc-pilot:0.1.0
    networks: [pilot]
    command: ["pilot-lab"]
    environment:
      PILOT_TEMPLATE: /pilot/template
      PILOT_REGISTRY: /packages
      PILOT_DATASETS: /pilot/datasets.yaml
      PILOT_EXAMPLE_FILL: /pilot/fills/default
      PILOT_LICENCES: /pilot/licences.yaml
    volumes:
      - pilot-packages:/packages
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8300/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Operator commands: docker compose run --rm pilot-tools pilot-build --fill fills/default
  pilot-tools:
    image: adlc-pilot:0.1.0
    networks: [pilot]
    profiles: [tools]
    working_dir: /pilot
    environment:
      PILOT_TEMPLATE: /pilot/template
      PILOT_REGISTRY: /packages
      PILOT_TRAFFIC_URL: http://pilot-traffic:8200
    volumes:
      - pilot-packages:/packages
      - pilot-data:/data

volumes:
  adlc-pgdata:
  adlc-files:
  pilot-packages:
  pilot-records:
  pilot-data:
  bridge-data:

networks:
  platform:
    name: adlc-platform
  pilot:
    name: adlc-pilot
